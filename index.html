<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Work out how you spend the 168 hours in your week. Free, open source and private: your data never leaves your browser."
    />
    <meta name="color-scheme" content="light dark" />
    <title>168 Hours</title>
    <script>
      // Apply the saved theme and language before first paint (no flash of the wrong
      // theme or text direction). Keep the keys in sync with useTheme.ts and i18n/index.ts.
      try {
        var theme = JSON.parse(localStorage.getItem('168-hours:theme') || '"system"')
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme
        var lang = localStorage.getItem('168-hours:language')
        if (lang === 'ar' || lang === 'en') {
          document.documentElement.lang = lang
          document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr'
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
